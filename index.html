<!DOCTYPE html>
<html lang="zh-TW">
<head>

  <title>純前端離線抽獎大會系統 (Offline Lucky Draw)</title>
  <style>:root{--bg-base:#111215;--bg-panel:#181a1f;--bg-surface:#20232a;--bg-card:#272a33;--border-subtle:rgba(255,255,255,0.08);--border-focus:rgba(212,175,55,0.5);--gold-primary:#d4af37;--gold-light:#f3e5ab;--gold-dark:#aa820a;--accent-color:#d4af37;--text-main:#f4f4f5;--text-sub:#a1a1aa;--text-muted:#71717a;--radius-sm:6px;--radius-md:10px;--radius-lg:16px;--font-stack:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang TC","Microsoft JhengHei",sans-serif}body[data-theme="ROYAL_CRIMSON"]{--bg-base:#14090b;--bg-panel:#1c0e11;--bg-surface:#261318;--bg-card:#321820;--gold-primary:#e53e3e;--gold-light:#feb2b2;--gold-dark:#9b2c2c;--accent-color:#e53e3e;--border-focus:rgba(229,62,62,0.5)}body[data-theme="MIDNIGHT_SAPPHIRE"]{--bg-base:#080d1a;--bg-panel:#0e162a;--bg-surface:#14203d;--bg-card:#1c2c54;--gold-primary:#38bdf8;--gold-light:#bae6fd;--gold-dark:#0284c7;--accent-color:#38bdf8;--border-focus:rgba(56,189,248,0.5)}body[data-theme="EMERALD_PALACE"]{--bg-base:#07130e;--bg-panel:#0d1e17;--bg-surface:#132a21;--bg-card:#1b382d;--gold-primary:#10b981;--gold-light:#a7f3d0;--gold-dark:#047857;--accent-color:#10b981;--border-focus:rgba(16,185,129,0.5)}*{box-sizing:border-box;margin:0;padding:0}body{background-color:var(--bg-base);color:var(--text-main);font-family:var(--font-stack);min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden;user-select:none;transition:background-color 0.3s ease}header{background:var(--bg-panel);border-bottom:1px solid var(--border-subtle);padding:12px 28px;display:flex;justify-content:space-between;align-items:center;z-index:20}.brand-group{display:flex;align-items:center;gap:12px}.brand-mark{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--gold-primary),var(--gold-dark));display:flex;align-items:center;justify-content:center}.brand-mark svg{width:18px;height:18px;fill:#111215}.brand-title{font-size:1.15rem;font-weight:700;color:#fff}.badge-pill{font-size:0.72rem;color:var(--gold-light);background:rgba(255,255,255,0.05);border:1px solid var(--border-subtle);padding:3px 8px;border-radius:4px}main{flex:1;display:flex;flex-direction:column;position:relative}.view-panel{display:none;width:100%;height:100%}.view-panel.active{display:flex;flex-direction:column;flex:1}#view-setup{max-width:1200px;width:100%;margin:20px auto;padding:0 20px;gap:18px}.workspace-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}@media (max-width:860px){.workspace-grid{grid-template-columns:1fr}}.panel-box{background:var(--bg-panel);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:18px 22px;display:flex;flex-direction:column;gap:14px}.panel-header{display:flex;justify-content:space-between;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--border-subtle)}.panel-caption{font-size:0.95rem;font-weight:700;color:var(--text-main)}.event-name-input{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-sm);color:#fff;padding:6px 12px;font-size:0.95rem;width:220px;outline:none}.event-name-input:focus{border-color:var(--border-focus)}textarea{width:100%;height:210px;background:var(--bg-base);border:1px solid var(--border-subtle);border-radius:var(--radius-md);color:#fff;padding:12px;font-size:0.9rem;resize:vertical;font-family:inherit;outline:none}textarea:focus{border-color:var(--border-focus)}.tools-toolbar{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}.btn-tool{background:var(--bg-surface);border:1px solid var(--border-subtle);color:var(--text-sub);padding:4px 10px;border-radius:var(--radius-sm);font-size:0.78rem;cursor:pointer}.btn-tool:hover{background:var(--bg-card);color:#fff}.file-dropzone{border:1.5px dashed var(--border-subtle);border-radius:var(--radius-md);padding:10px;text-align:center;color:var(--text-sub);cursor:pointer;font-size:0.82rem}.file-dropzone:hover{border-color:var(--gold-primary);color:#fff}.order-config-bar{display:flex;align-items:center;justify-content:space-between;background:var(--bg-surface);border:1px solid var(--border-subtle);padding:8px 12px;border-radius:var(--radius-md)}.styled-select{background:var(--bg-base);border:1px solid var(--border-subtle);color:#fff;padding:4px 8px;border-radius:var(--radius-sm);font-size:0.8rem;outline:none;cursor:pointer}.prizes-container{display:flex;flex-direction:column;gap:8px;max-height:250px;overflow-y:auto;padding-right:4px}.prize-card{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:8px 12px;display:flex;align-items:center;gap:8px}.prize-rank-pill{font-size:0.7rem;font-weight:700;padding:2px 6px;border-radius:4px;background:rgba(212,175,55,0.15);color:var(--gold-primary);border:1px solid rgba(212,175,55,0.3);min-width:66px;text-align:center}.prize-card input[type="text"]{flex:1;background:var(--bg-base);border:1px solid var(--border-subtle);border-radius:var(--radius-sm);color:#fff;padding:4px 8px;font-size:0.88rem;outline:none}.prize-card input[type="number"]{width:65px;background:var(--bg-base);border:1px solid var(--border-subtle);border-radius:var(--radius-sm);color:#fff;padding:4px 6px;font-size:0.88rem;text-align:center}.reorder-btns{display:flex;flex-direction:column;gap:1px}.btn-icon{background:transparent;border:none;color:var(--text-muted);cursor:pointer;padding:2px;border-radius:3px;font-size:0.72rem}.btn-icon:hover{color:#fff}.rules-row{display:flex;gap:16px;padding:6px 0;color:var(--text-sub);font-size:0.82rem;align-items:center;flex-wrap:wrap}.checkbox-item{display:flex;align-items:center;gap:6px;cursor:pointer}.checkbox-item input{accent-color:var(--gold-primary);cursor:pointer}.actions-footer{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-top:1px solid var(--border-subtle)}.btn-cta{padding:10px 28px;font-size:0.95rem;font-weight:700;border-radius:var(--radius-md);cursor:pointer;border:none;display:inline-flex;align-items:center;gap:8px}.btn-gold-action{background:linear-gradient(135deg,var(--gold-light) 0%,var(--gold-primary) 100%);color:#111215;box-shadow:0 4px 16px rgba(0,0,0,0.4)}.btn-gold-action:hover:not(:disabled){transform:translateY(-1px)}.btn-secondary-action{background:var(--bg-surface);color:var(--text-main);border:1px solid var(--border-subtle)}#view-stage{padding:14px 28px;height:calc(100vh - 60px);display:flex;flex-direction:column;justify-content:space-between}.stage-topbar{display:flex;justify-content:space-between;align-items:center;background:var(--bg-panel);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:12px 24px}.stage-round-pill{font-size:0.75rem;font-weight:700;color:var(--gold-light)}.stage-prize-title{font-size:1.6rem;font-weight:900;color:#fff}.stage-stats-strip{display:flex;gap:12px;font-size:0.85rem;color:var(--text-sub)}.stat-badge{background:var(--bg-surface);border:1px solid var(--border-subtle);padding:4px 10px;border-radius:var(--radius-sm)}.stat-badge strong{color:#fff;margin-left:4px}.stage-arena{display:grid;grid-template-columns:1fr 320px;gap:24px;align-items:center;margin:auto 0;max-width:1240px;width:100%;align-self:center}@media (max-width:950px){.stage-arena{grid-template-columns:1fr}.stage-feed-box{display:none !important}}.stage-spotlight{display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;min-height:440px}#stage-canvas{width:480px;height:440px;border-radius:var(--radius-lg);box-shadow:0 16px 40px rgba(0,0,0,0.6)}.stage-feed-box{background:var(--bg-panel);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:14px 18px;height:440px;display:flex;flex-direction:column}.feed-header{font-size:0.9rem;font-weight:700;color:#fff;display:flex;justify-content:space-between;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--border-subtle)}.feed-scroll{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin-top:10px}.feed-item{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:8px 12px;display:flex;justify-content:space-between;align-items:center}.feed-tier-name{font-size:0.75rem;font-weight:700;color:var(--gold-primary)}.feed-winner-name{font-size:1.05rem;font-weight:800;color:#fff}.stage-controls{display:flex;justify-content:space-between;align-items:center;background:var(--bg-panel);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:14px 24px}.btn-stage-spin{padding:14px 48px;font-size:1.3rem;font-weight:900;border-radius:50px;cursor:pointer;border:none;background:linear-gradient(135deg,var(--gold-light) 0%,var(--gold-primary) 100%);color:#111215;box-shadow:0 6px 25px rgba(0,0,0,0.5)}.btn-stage-spin:disabled{opacity:0.4;cursor:not-allowed}.btn-stage-spin.btn-conclude{background:linear-gradient(135deg,#fb923c 0%,#ea580c 100%);color:#fff}.modal-backdrop{position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(10,11,14,0.88);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:200}.modal-backdrop.active{display:flex}.ceremony-card{background:var(--bg-panel);border:1.5px solid var(--gold-primary);border-radius:20px;padding:36px 48px;text-align:center;max-width:480px;width:90%;box-shadow:0 20px 50px rgba(0,0,0,0.9)}.ceremony-tier{color:var(--gold-primary);font-size:1.1rem;font-weight:700}.ceremony-name{font-size:3.2rem;font-weight:900;color:#fff;margin:14px 0 24px;word-break:break-all}.dialog-window{background:var(--bg-panel);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:22px 26px;max-width:420px;width:90%;display:flex;flex-direction:column;gap:14px}#confetti-canvas{position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:150}.hidden{display:none !important}</style>

<body data-theme="OBSIDIAN_GOLD">

  <header>
    <div class="brand-group">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      </div>
      <div>
        <div class="brand-title" id="header-brand-title">年度慶典抽獎大會</div>
      </div>
      <span class="badge-pill" id="stage-mode-indicator">5大開獎模式 v1.3.0</span>
    </div>

    <div style="display:flex; gap:10px; align-items:center;">
      <select id="theme-selector" class="styled-select" title="更換經典配色主題框架">
        <option value="OBSIDIAN_GOLD" selected>黑曜香檳金 (尊爵黑金)</option>
        <option value="ROYAL_CRIMSON">皇家緋紅慶典 (春酒迎春)</option>
        <option value="MIDNIGHT_SAPPHIRE">午夜深藍星鑽 (科技年會)</option>
        <option value="EMERALD_PALACE">祖母綠翡翠殿 (富貴翡翠)</option>
      </select>
      <button id="btn-fullscreen-toggle" class="btn-tool" title="全螢幕投屏模式">⛶ 全螢幕</button>
      <button id="btn-emergency-edit" class="btn-tool hidden" style="color:var(--gold-light);">⮌ 返回設定</button>
    </div>
  </header>

  <main>
    <!-- 設定面板 (SETUP) -->
    <div id="view-setup" class="view-panel active">
      <div class="workspace-grid">
        <div class="panel-box">
          <div class="panel-header">
            <span class="panel-caption">活動名稱與名冊</span>
            <input type="text" id="input-event-name" class="event-name-input" value="年度慶典抽獎大會" placeholder="大會活動名稱" title="輸入大會名稱">
          </div>

          <div>
            <textarea id="input-candidates" placeholder="請在此貼入名單，每行一人&#10;例如：&#10;陳柏宇&#10;林冠廷&#10;黃詩婷&#10;張家豪&#10;李雅婷"></textarea>
            <div class="tools-toolbar">
              <button id="btn-load-sample" class="btn-tool">載入範例 (30人)</button>
              <button id="btn-dedup-names" class="btn-tool">移除重複人名</button>
              <button id="btn-clear-names" class="btn-tool">清空名冊</button>
              <span style="font-size:0.78rem; color:var(--text-muted); margin-left:auto; align-self:center;" id="candidate-count-badge">0 人登記</span>
            </div>
          </div>

          <div class="file-dropzone" id="file-dropzone">
            點此或拖曳 .txt / .csv 名單檔案至此匯入
            <input type="file" id="file-input" accept=".txt,.csv" style="display:none;">
          </div>
        </div>

        <div class="panel-box">
          <div class="panel-header">
            <span class="panel-caption">獎項與開獎規則</span>
            <button id="btn-add-prize" class="btn-tool" style="color:var(--gold-light);">+ 新增獎項</button>
          </div>

          <div class="order-config-bar">
            <span style="font-size:0.8rem; color:var(--text-sub);">大會流程順序：</span>
            <select id="config-draw-order" class="styled-select">
              <option value="BOTTOM_UP" selected>由小獎抽至大獎（暖場 ➔ 壓軸大獎）</option>
              <option value="TOP_DOWN">由大獎抽至小獎（由上至下）</option>
            </select>
          </div>

          <div class="prizes-container" id="prizes-list"></div>

          <div class="rules-row">
            <label class="checkbox-item">
              <input type="checkbox" id="config-allow-duplicates"> 允許重複獲獎
            </label>
            <div id="max-win-container" style="display:none; align-items:center; gap:6px;">
              <span style="color:var(--text-muted);">每人上限：</span>
              <input type="number" id="config-max-win-limit" min="1" max="10" value="2" style="width:50px; background:var(--bg-base); border:1px solid var(--border-subtle); border-radius:4px; color:#fff; text-align:center; padding:2px 4px; font-size:0.8rem;">
              <span style="color:var(--text-muted);">次</span>
            </div>
            <label class="checkbox-item" style="margin-left:auto;">
              <input type="checkbox" id="config-auto-switch" checked> 抽滿自動推進次輪
            </label>
          </div>
        </div>
      </div>

      <div class="actions-footer">
        <button id="btn-export-html" class="btn-cta btn-secondary-action">
          <svg style="width:15px;height:15px;fill:currentColor;" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
          匯出隨身單檔 HTML
        </button>
        <button id="btn-start-stage" class="btn-cta btn-gold-action">進入抽獎大會舞台</button>
      </div>
    </div>

    <!-- 抽獎舞台 (STAGE) -->
    <div id="view-stage" class="view-panel">
      <div class="stage-topbar">
        <div>
          <span class="stage-round-pill" id="stage-order-tag">大會抽獎 ｜ 第 1 輪</span>
          <div class="stage-prize-title" id="stage-prize-name">特獎</div>
        </div>

        <div class="stage-stats-strip">
          <div class="stat-badge">本輪剩額<strong id="stage-quota-remaining">0 / 0</strong></div>
          <div class="stat-badge">候選池剩餘<strong id="stage-candidates-remaining">0 人</strong></div>
          <button id="btn-export-csv" class="btn-tool" style="padding:4px 10px;">匯出 CSV</button>
          <button id="btn-reset-all" class="btn-tool" style="padding:4px 10px; color:#f87171;">重置大會</button>
        </div>
      </div>

      <div class="stage-arena">
        <div class="stage-spotlight">
          <!-- 核心動態渲染 Canvas (支援 5 種模式繪製) -->
          <canvas id="stage-canvas" width="520" height="420"></canvas>
        </div>

        <div class="stage-feed-box">
          <div class="feed-header">
            <span>現場即時榮譽榜</span>
            <span class="badge-pill" id="history-counter">0 人獲獎</span>
          </div>
          <div class="feed-scroll" id="history-feed">
            <div style="color:var(--text-muted); text-align:center; margin-top:40px; font-size:0.82rem;">大會即將開獎，拭目以待</div>
          </div>
        </div>
      </div>

      <div class="stage-controls">
        <div style="font-size:0.85rem; color:var(--text-sub);" id="stage-status-hint">
          輕按 <span style="background:var(--bg-surface); padding:2px 6px; border-radius:4px; color:#fff;">Space 空白鍵</span> 開始搖獎
        </div>
        <button id="btn-spin" class="btn-stage-spin">開始抽獎</button>
      </div>
    </div>
  </main>

  <!-- 慶祝盛典彈窗 (Ceremony Modal) -->
  <div id="winner-modal-overlay" class="modal-backdrop">
    <div class="ceremony-card">
      <div class="ceremony-tier" id="modal-prize-tag">恭喜榮獲 特獎</div>
      <div class="ceremony-name" id="modal-winner-name">得獎人姓名</div>
      <button id="btn-modal-continue" class="btn-cta btn-gold-action" style="padding:10px 36px; font-size:1.1rem;">
        抽取下一位 (Space)
      </button>
    </div>
  </div>

  <!-- 自訂確認對話框 -->
  <div id="dialog-modal-overlay" class="modal-backdrop">
    <div class="dialog-window">
      <div style="font-size:1.1rem; font-weight:800; color:#fff;" id="dialog-title">系統提示</div>
      <div style="font-size:0.9rem; color:var(--text-sub); line-height:1.5;" id="dialog-msg">訊息說明內容</div>
      <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:6px;">
        <button id="dialog-btn-cancel" class="btn-tool" style="padding:6px 14px;">取消</button>
        <button id="dialog-btn-confirm" class="btn-cta btn-gold-action" style="padding:6px 18px; font-size:0.9rem;">確定</button>
      </div>
    </div>
  </div>

  <canvas id="confetti-canvas"></canvas>

  <script id="__INITIAL_BUNDLE__" type="text/plain">
  </script>
