 solid var(--border-subtle);border-radius:var(--radius-lg);padding:20px 24px;display:flex;flex-direction:column;gap:16px;box-shadow:0 4px 20px rgba(0,0,0,0.25)}.panel-header{display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--border-subtle)}.panel-caption{font-size:0.95rem;font-weight:700;color:var(--text-main);display:flex;align-items:center;gap:8px}.textarea-wrapper{position:relative;display:flex;flex-direction:column}textarea{width:100%;height:240px;background:var(--bg-base);border:1px solid var(--border-subtle);border-radius:var(--radius-md);color:#fff;padding:14px;font-size:0.95rem;line-height:1.6;resize:vertical;font-family:inherit;outline:none;transition:border-color 0.2s}textarea:focus{border-color:var(--border-focus)}.tools-toolbar{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.btn-tool{background:var(--bg-surface);border:1px solid var(--border-subtle);color:var(--text-sub);padding:5px 12px;border-radius:var(--radius-sm);font-size:0.8rem;cursor:pointer;transition:all 0.15s}.btn-tool:hover{background:var(--bg-card);color:#fff}.file-dropzone{border:1.5px dashed var(--border-subtle);border-radius:var(--radius-md);padding:12px;text-align:center;color:var(--text-sub);cursor:pointer;font-size:0.85rem;transition:all 0.2s;background:rgba(255,255,255,0.015)}.file-dropzone:hover{border-color:var(--gold-primary);background:rgba(212,175,55,0.04);color:#fff}.order-config-bar{display:flex;align-items:center;justify-content:space-between;background:var(--bg-surface);border:1px solid var(--border-subtle);padding:10px 14px;border-radius:var(--radius-md)}.order-config-bar span{font-size:0.85rem;color:var(--text-sub)}.styled-select{background:var(--bg-base);border:1px solid var(--border-subtle);color:#fff;padding:5px 10px;border-radius:var(--radius-sm);font-size:0.82rem;outline:none;cursor:pointer}.prizes-container{display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto;padding-right:4px}.pri
