  <style>:root{--bg-base:#111215;--bg-panel:#181a1f;--bg-surface:#20232a;--bg-card:#272a33;--border-subtle:rgba(255,255,255,0.08);--border-focus:rgba(212,175,55,0.5);--gold-primary:#d4af37;--gold-light:#f3e5ab;--gold-dark:#aa820a;--crimson-accent:#c53030;--emerald-accent:#2e7d32;--text-main:#f4f4f5;--text-sub:#a1a1aa;--text-muted:#71717a;--radius-sm:6px;--radius-md:10px;--radius-lg:16px;--shadow-elevation:0 12px 32px rgba(0,0,0,0.45);--font-stack:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}*{box-sizing:border-box;margin:0;padding:0}body{background-color:var(--bg-base);color:var(--text-main);font-family:var(--font-stack);min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden;letter-spacing:-0.01em;user-select:none}header{background:var(--bg-panel);border-bottom:1px solid var(--border-subtle);padding:14px 28px;display:flex;justify-content:space-between;align-items:center;z-index:20}.brand-group{display:flex;align-items:center;gap:14px}.brand-mark{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--gold-primary),var(--gold-dark));display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(212,175,55,0.3)}.brand-mark svg{width:18px;height:18px;fill:#111215}.brand-title{font-size:1.15rem;font-weight:700;color:#fff;letter-spacing:0.02em}.brand-tag{font-size:0.75rem;color:var(--gold-light);background:rgba(212,175,55,0.12);border:1px solid rgba(212,175,55,0.25);padding:2px 8px;border-radius:4px;font-weight:500}main{flex:1;display:flex;flex-direction:column;position:relative}.view-panel{display:none;width:100%;height:100%}.view-panel.active{display:flex;flex-direction:column;flex:1}#view-setup{max-width:1200px;width:100%;margin:24px auto;padding:0 24px;gap:20px}.workspace-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:24px}@media (max-width:900px){.workspace-grid{grid-template-columns:1fr}}.panel-box{background:var(--bg-panel);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:20px 24px;display:flex;flex-direction:column;gap:16px;box-shadow:0 4px 20px rgba(0,0,0,0.25)}.panel-header{display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--border-subtle)}.panel-caption{font-size:0.95rem;font-weight:700;color:var(--text-main);display:flex;align-items:center;gap:8px}.textarea-wrapper{position:relative;display:flex;flex-direction:column}textarea{width:100%;height:240px;background:var(--bg-base);border:1px solid var(--border-subtle);border-radius:var(--radius-md);color:#fff;padding:14px;font-size:0.95rem;line-height:1.6;resize:vertical;font-family:inherit;outline:none;transition:border-color 0.2s}textarea:focus{border-color:var(--border-focus)}.tools-toolbar{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.btn-tool{background:var(--bg-surface);border:1px solid var(--border-subtle);color:var(--text-sub);padding:5px 12px;border-radius:var(--radius-sm);font-size:0.8rem;cursor:pointer;transition:all 0.15s}.btn-tool:hover{background:var(--bg-card);color:#fff}.file-dropzone{border:1.5px dashed var(--border-subtle);border-radius:var(--radius-md);padding:12px;text-align:center;color:var(--text-sub);cursor:pointer;font-size:0.85rem;transition:all 0.2s;background:rgba(255,255,255,0.015)}.file-dropzone:hover{border-color:var(--gold-primary);background:rgba(212,175,55,0.04);color:#fff}.order-config-bar{display:flex;align-items:center;justify-content:space-between;background:var(--bg-surface);border:1px solid var(--border-subtle);padding:10px 14px;border-radius:var(--radius-md)}.order-config-bar span{font-size:0.85rem;color:var(--text-sub)}.styled-select{background:var(--bg-base);border:1px solid var(--border-subtle);color:#fff;padding:5px 10px;border-radius:var(--radius-sm);font-size:0.82rem;outline:none;cursor:pointer}.prizes-container{display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto;padding-right:4px}.prize-card{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:10px 14px;display:flex;align-items:center;gap:10px;transition:transform 0.15s,border-color 0.15s}.prize-card:hover{border-color:rgba(255,255,255,0.18)}.prize-rank-pill{font-size:0.72rem;font-weight:700;padding:3px 8px;border-radius:4px;background:rgba(212,175,55,0.15);color:var(--gold-primary);border:1px solid rgba(212,175,55,0.3);white-space:nowrap;min-width:68px;text-align:center}.prize-rank-pill.grand{background:rgba(197,48,48,0.2);color:#feb2b2;border-color:rgba(197,48,48,0.4)}.prize-card input[type="text"]{flex:1;background:var(--bg-base);border:1px solid var(--border-subtle);border-radius:var(--radius-sm);color:#fff;padding:6px 10px;font-size:0.9rem;outline:none}.prize-card input[type="text"]:focus{border-color:var(--border-focus)}.prize-card input[type="number"]{width:72px;background:var(--bg-base);border:1px solid var(--border-subtle);border-radius:var(--radius-sm);color:#fff;padding:6px 8px;font-size:0.9rem;text-align:center;outline:none}.reorder-btns{display:flex;flex-direction:column;gap:2px}.btn-icon{background:transparent;border:none;color:var(--text-muted);cursor:pointer;padding:3px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:0.75rem}.btn-icon:hover{color:#fff;background:rgba(255,255,255,0.08)}.btn-icon.del:hover{color:#f87171}.rules-row{display:flex;gap:20px;padding:8px 0;color:var(--text-sub);font-size:0.85rem}.checkbox-item{display:flex;align-items:center;gap:7px;cursor:pointer}.checkbox-item input{accent-color:var(--gold-primary);cursor:pointer}.actions-footer{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-top:1px solid var(--border-subtle);margin-top:8px}.btn-cta{padding:12px 32px;font-size:1rem;font-weight:700;border-radius:var(--radius-md);cursor:pointer;border:none;transition:all 0.2s cubic-bezier(0.16,1,0.3,1);display:inline-flex;align-items:center;gap:10px}.btn-gold-action{background:linear-gradient(135deg,#e5c07b 0%,#d4af37 100%);color:#111215;box-shadow:0 4px 18px rgba(212,175,55,0.35)}.btn-gold-action:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 24px rgba(212,175,55,0.5)}.btn-secondary-action{background:var(--bg-surface);color:var(--text-main);border:1px solid var(--border-subtle)}.btn-secondary-action:hover:not(:disabled){background:var(--bg-card);border-color:rgba(255,255,255,0.2)}#view-stage{padding:16px 36px 24px;height:calc(100vh - 65px);display:flex;flex-direction:column;justify-content:space-between}.stage-topbar{display:flex;justify-content:space-between;align-items:center;background:var(--bg-panel);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:14px 28px;box-shadow:var(--shadow-elevation)}.stage-tier-info{display:flex;flex-direction:column;gap:4px}.stage-round-pill{font-size:0.8rem;font-weight:700;color:var(--gold-light);letter-spacing:0.05em;text-transform:uppercase}.stage-prize-title{font-size:1.8rem;font-weight:900;color:#fff;letter-spacing:0.02em}.stage-stats-strip{display:flex;gap:16px;font-size:0.9rem;color:var(--text-sub)}.stat-badge{background:var(--bg-surface);border:1px solid var(--border-subtle);padding:6px 14px;border-radius:var(--radius-sm);display:flex;align-items:center;gap:6px}.stat-badge strong{color:#fff}.stage-arena{display:grid;grid-template-columns:1fr 340px;gap:32px;align-items:center;margin:auto 0;max-width:1300px;width:100%;align-self:center}@media (max-width:1000px){.stage-arena{grid-template-columns:1fr}.stage-feed-box{display:none !important}}.stage-spotlight{display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}.wheel-assembly{position:relative;width:480px;height:480px;display:flex;align-items:center;justify-content:center}#wheel-canvas{width:480px;height:480px;border-radius:50%;box-shadow:0 16px 50px rgba(0,0,0,0.7),0 0 30px rgba(212,175,55,0.15)}.slot-machine-frame{width:100%;max-width:580px;height:220px;background:#0d0e12;border:2px solid var(--gold-dark);border-radius:20px;display:none;align-items:center;justify-content:center;overflow:hidden;box-shadow:inset 0 0 40px rgba(0,0,0,0.9),0 12px 40px rgba(0,0,0,0.6);position:relative}.slot-machine-frame::before,.slot-machine-frame::after{content:'';position:absolute;left:0;right:0;height:45px;pointer-events:none;z-index:3}.slot-machine-frame::before{top:0;background:linear-gradient(to bottom,#0d0e12,transparent)}.slot-machine-frame::after{bottom:0;background:linear-gradient(to top,#0d0e12,transparent)}.slot-machine-card{font-size:3.2rem;font-weight:900;color:#fff;text-shadow:0 4px 20px rgba(0,0,0,0.9);letter-spacing:0.04em;text-align:center;padding:0 24px}.slot-machine-card.rolling{color:#f3e5ab;filter:blur(0.8px)}.slot-machine-card.winner{color:var(--gold-primary);animation:winnerBounce 0.5s ease infinite alternate}@keyframes winnerBounce{from{transform:scale(1)}to{transform:scale(1.08)}}.stage-feed-box{background:var(--bg-panel);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:16px 20px;height:480px;display:flex;flex-direction:column;box-shadow:var(--shadow-elevation)}.feed-header{font-size:0.95rem;font-weight:700;color:#fff;display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--border-subtle)}.feed-scroll{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;margin-top:12px;padding-right:4px}.feed-item{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;animation:feedEnter 0.3s cubic-bezier(0.16,1,0.3,1)}@keyframes feedEnter{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}.feed-tier-name{font-size:0.78rem;font-weight:700;color:var(--gold-primary)}.feed-winner-name{font-size:1.15rem;font-weight:800;color:#fff;margin-top:2px}.stage-controls{display:flex;justify-content:space-between;align-items:center;background:var(--bg-panel);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:16px 28px}.stage-instructions{font-size:0.9rem;color:var(--text-sub)}.stage-instructions kbd{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:4px;padding:2px 8px;font-size:0.8rem;color:#fff;margin:0 4px}.btn-stage-spin{padding:16px 52px;font-size:1.4rem;font-weight:900;letter-spacing:0.05em;border-radius:50px;cursor:pointer;border:none;background:linear-gradient(135deg,#f3e5ab 0%,#d4af37 60%,#aa820a 100%);color:#111215;box-shadow:0 8px 30px rgba(212,175,55,0.45);transition:all 0.2s cubic-bezier(0.16,1,0.3,1)}.btn-stage-spin:hover:not(:disabled){transform:translateY(-2px) scale(1.02);box-shadow:0 12px 36px rgba(212,175,55,0.6)}.btn-stage-spin:disabled{opacity:0.4;cursor:not-allowed;transform:none}.btn-stage-spin.btn-conclude{background:linear-gradient(135deg,#fb923c 0%,#ea580c 100%);color:#fff;box-shadow:0 8px 30px rgba(234,88,12,0.45)}.modal-backdrop{position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(10,11,14,0.88);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;z-index:200}.modal-backdrop.active{display:flex}.ceremony-card{background:radial-gradient(circle at 50% 20%,#2a251a 0%,#16181f 80%);border:1.5px solid var(--gold-primary);border-radius:24px;padding:44px 56px;text-align:center;max-width:520px;width:90%;box-shadow:0 24px 60px rgba(0,0,0,0.9),0 0 50px rgba(212,175,55,0.35);animation:ceremonyPop 0.4s cubic-bezier(0.16,1,0.3,1)}@keyframes ceremonyPop{from{transform:scale(0.85);opacity:0}to{transform:scale(1);opacity:1}}.ceremony-tier{color:var(--gold-primary);font-size:1.15rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase}.ceremony-name{font-size:3.6rem;font-weight:900;color:#ffffff;margin:16px 0 28px;text-shadow:0 4px 30px rgba(212,175,55,0.5);word-break:break-all}.dialog-window{background:var(--bg-panel);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:26px 30px;max-width:440px;width:90%;box-shadow:0 24px 60px rgba(0,0,0,0.8);display:flex;flex-direction:column;gap:16px}.dialog-headline{font-size:1.2rem;font-weight:800;color:#fff}.dialog-body{font-size:0.95rem;color:var(--text-sub);line-height:1.6}.dialog-foot{display:flex;justify-content:flex-end;gap:12px;margin-top:4px}#confetti-canvas{position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:150}.hidden{display:none !important}body[data-theme="ROYAL_CRIMSON"]{--bg-base:#14090b;--bg-panel:#1c0e11;--bg-surface:#261318;--bg-card:#321820;--gold-primary:#e53e3e;--gold-light:#feb2b2;--gold-dark:#9b2c2c;--accent-color:#e53e3e;--border-focus:rgba(229,62,62,0.5)}body[data-theme="MIDNIGHT_SAPPHIRE"]{--bg-base:#080d1a;--bg-panel:#0e162a;--bg-surface:#14203d;--bg-card:#1c2c54;--gold-primary:#38bdf8;--gold-light:#bae6fd;--gold-dark:#0284c7;--accent-color:#38bdf8;--border-focus:rgba(56,189,248,0.5)}body[data-theme="EMERALD_PALACE"]{--bg-base:#07130e;--bg-panel:#0d1e17;--bg-surface:#132a21;--bg-card:#1b382d;--gold-primary:#10b981;--gold-light:#a7f3d0;--gold-dark:#047857;--accent-color:#10b981;--border-focus:rgba(16,185,129,0.5)}.event-name-input{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-sm);color:#fff;padding:4px 10px;font-size:0.9rem;width:200px;outline:none}.event-name-input:focus{border-color:var(--border-focus)}</style></head><body><header><div class="brand-group"><div class="brand-mark"><svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg></div><div class="brand-title" id="header-brand-title">年度慶典抽獎大會</div></div><div style="display:flex; gap:10px; align-items:center;"><select id="theme-selector" class="styled-select" title="更換經典配色主題框架"><option value="OBSIDIAN_GOLD" selected>黑曜香檳金 (尊爵黑金)</option><option value="ROYAL_CRIMSON">皇家緋紅慶典 (春酒迎春)</option><option value="MIDNIGHT_SAPPHIRE">午夜深藍星鑽 (科技年會)</option><option value="EMERALD_PALACE">祖母綠翡翠殿 (富貴翡翠)</option></select></div><div style="display:flex; gap:10px;"><button id="btn-fullscreen-toggle" class="btn-tool" title="全螢幕投屏模式"> ⛶ 全螢幕投屏 </button><button id="btn-emergency-edit" class="btn-tool hidden" style="color:var(--gold-light);"> ⮌ 返回設定 </button></div></header><main><div id="view-setup" class="view-panel active"><div class="workspace-grid"><div class="panel-box"><div class="panel-header"><span class="panel-caption"> 候選人名冊 </span><span class="brand-tag" id="candidate-count-badge">0 人登記</span></div><div class="textarea-wrapper"><textarea id="input-candidates" placeholder="在此處每行輸入一位候選人姓名，例如：&#10;陳柏宇&#10;林冠廷&#10;黃詩婷&#10;張家豪&#10;李雅婷"></textarea><div class="tools-toolbar"><button id="btn-load-sample" class="btn-tool">載入範例名單</button><button id="btn-dedup-names" class="btn-tool">移除重複名單</button><button id="btn-clear-names" class="btn-tool">清空名冊</button></div></div><div class="file-dropzone" id="file-dropzone"> 將本機 .txt 或 .csv 名冊檔案拖曳至此直接匯入 <input type="file" id="file-input" accept=".txt,.csv" style="display:none;"></div></div><div class="panel-box"><div class="panel-header"><span class="panel-caption"> 獎項層級與順位 </span><button id="btn-add-prize" class="btn-tool" style="color:var(--gold-light);">+ 新增獎項</button></div><div class="order-config-bar"><span>大會抽獎流程順序：</span><select id="config-draw-order" class="styled-select"><option value="BOTTOM_UP" selected>由小獎抽至大獎（暖場 ➔ 壓軸高潮）</option><option value="TOP_DOWN">由大獎抽至小獎（由上至下）</option></select></div><div class="prizes-container" id="prizes-list"></div><div class="rules-row"><label class="checkbox-item"><input type="checkbox" id="config-allow-duplicates"> 允許重複獲獎 </label><div id="max-win-container" style="display:none; align-items:center; gap:6px;"><span style="color:var(--text-muted); font-size:0.8rem;">每人上限：</span><input type="number" id="config-max-win-limit" min="1" max="10" value="2" style="width:50px; background:var(--bg-base
