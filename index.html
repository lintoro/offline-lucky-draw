<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
  <title>純前端離線抽獎系統 (Offline Lucky Draw v1.2.0)</title>
  <style>:root{--bg-base:#111215;--bg-panel:#181a1f;--bg-surface:#20232a;--bg-card:#272a33;--border-subtle:rgba(255,255,255,0.08);--border-focus:rgba(212,175,55,0.5);--gold-primary:#d4af37;--gold-light:#f3e5ab;--gold-dark:#aa820a;--crimson-accent:#c53030;--emerald-accent:#2e7d32;--text-main:#f4f4f5;--text-sub:#a1a1aa;--text-muted:#71717a;--radius-sm:6px;--radius-md:10px;--radius-lg:16px;--shadow-elevation:0 12px 32px rgba(0,0,0,0.45);--font-stack:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}*{box-sizing:border-box;margin:0;padding:0}body{background-color:var(--bg-base);color:var(--text-main);font-family:var(--font-stack);min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden;letter-spacing:-0.01em;user-select:none}header{background:var(--bg-panel);border-bottom:1px solid var(--border-subtle);padding:14px 28px;display:flex;justify-content:space-between;align-items:center;z-index:20}.brand-group{display:flex;align-items:center;gap:14px}.brand-mark{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--gold-primary),var(--gold-dark));display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(212,175,55,0.3)}.brand-mark svg{width:18px;height:18px;fill:#111215}.brand-title{font-size:1.15rem;font-weight:700;color:#fff;letter-spacing:0.02em}.brand-tag{font-size:0.75rem;color:var(--gold-light);background:rgba(212,175,55,0.12);border:1px solid rgba(212,175,55,0.25);padding:2px 8px;border-radius:4px;font-weight:500}main{flex:1;display:flex;flex-direction:column;position:relative}.view-panel{display:none;width:100%;height:100%}.view-panel.active{display:flex;flex-direction:column;flex:1}#view-setup{max-width:1200px;width:100%;margin:24px auto;padding:0 24px;gap:20px}.workspace-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:24px}@media (max-width:900px){.workspace-grid{grid-template-columns:1fr}}.panel-box{background:var(--bg-panel);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:20px 24px;display:flex;flex-direction:column;gap:16px;box-shadow:0 4px 20px rgba(0,0,0,0.25)}.panel-header{display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--border-subtle)}.panel-caption{font-size:0.95rem;font-weight:700;color:var(--text-main);display:flex;align-items:center;gap:8px}.textarea-wrapper{position:relative;display:flex;flex-direction:column}textarea{width:100%;height:240px;background:var(--bg-base);border:1px solid var(--border-subtle);border-radius:var(--radius-md);color:#fff;padding:14px;font-size:0.95rem;line-height:1.6;resize:vertical;font-family:inherit;outline:none;transition:border-color 0.2s}textarea:focus{border-color:var(--border-focus)}.tools-toolbar{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.btn-tool{background:var(--bg-surface);border:1px solid var(--border-subtle);color:var(--text-sub);padding:5px 12px;border-radius:var(--radius-sm);font-size:0.8rem;cursor:pointer;transition:all 0.15s}.btn-tool:hover{background:var(--bg-card);color:#fff}.file-dropzone{border:1.5px dashed var(--border-subtle);border-radius:var(--radius-md);padding:12px;text-align:center;color:var(--text-sub);cursor:pointer;font-size:0.85rem;transition:all 0.2s;background:rgba(255,255,255,0.015)}.file-dropzone:hover{border-color:var(--gold-primary);background:rgba(212,175,55,0.04);color:#fff}.order-config-bar{display:flex;align-items:center;justify-content:space-between;background:var(--bg-surface);border:1px solid var(--border-subtle);padding:10px 14px;border-radius:var(--radius-md)}.order-config-bar span{font-size:0.85rem;color:var(--text-sub)}.styled-select{background:var(--bg-base);border:1px solid var(--border-subtle);color:#fff;padding:5px 10px;border-radius:var(--radius-sm);font-size:0.82rem;outline:none;cursor:pointer}.prizes-container{display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto;padding-right:4px}.prize-card{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:10px 14px;display:flex;align-items:center;gap:10px;transition:transform 0.15s,border-color 0.15s}.prize-card:hover{border-color:rgba(255,255,255,0.18)}.prize-rank-pill{font-size:0.72rem;font-weight:700;padding:3px 8px;border-radius:4px;background:rgba(212,175,55,0.15);color:var(--gold-primary);border:1px solid rgba(212,175,55,0.3);white-space:nowrap;min-width:68px;text-align:center}.prize-rank-pill.grand{background:rgba(197,48,48,0.2);color:#feb2b2;border-color:rgba(197,48,48,0.4)}.prize-card input[type="text"]{flex:1;background:var(--bg-base);border:1px solid var(--border-subtle);border-radius:var(--radius-sm);color:#fff;padding:6px 10px;font-size:0.9rem;outline:none}.prize-card input[type="text"]:focus{border-color:var(--border-focus)}.prize-card input[type="number"]{width:72px;background:var(--bg-base);border:1px solid var(--border-subtle);border-radius:var(--radius-sm);color:#fff;padding:6px 8px;font-size:0.9rem;text-align:center;outline:none}.reorder-btns{display:flex;flex-direction:column;gap:2px}.btn-icon{background:transparent;border:none;color:var(--text-muted);cursor:pointer;padding:3px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:0.75rem}.btn-icon:hover{color:#fff;background:rgba(255,255,255,0.08)}.btn-icon.del:hover{color:#f87171}.rules-row{display:flex;gap:20px;padding:8px 0;color:var(--text-sub);font-size:0.85rem}.checkbox-item{display:flex;align-items:center;gap:7px;cursor:pointer}.checkbox-item input{accent-color:var(--gold-primary);cursor:pointer}.actions-footer{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-top:1px solid var(--border-subtle);margin-top:8px}.btn-cta{padding:12px 32px;font-size:1rem;font-weight:700;border-radius:var(--radius-md);cursor:pointer;border:none;transition:all 0.2s cubic-bezier(0.16,1,0.3,1);display:inline-flex;align-items:center;gap:10px}.btn-gold-action{background:linear-gradient(135deg,#e5c07b 0%,#d4af37 100%);color:#111215;box-shadow:0 4px 18px rgba(212,175,55,0.35)}.btn-gold-action:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 24px rgba(212,175,55,0.5)}.btn-secondary-action{background:var(--bg-surface);color:var(--text-main);border:1px solid var(--border-subtle)}.btn-secondary-action:hover:not(:disabled){background:var(--bg-card);border-color:rgba(255,255,255,0.2)}#view-stage{padding:16px 36px 24px;height:calc(100vh - 65px);display:flex;flex-direction:column;justify-content:space-between}.stage-topbar{display:flex;justify-content:space-between;align-items:center;background:var(--bg-panel);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:14px 28px;box-shadow:var(--shadow-elevation)}.stage-tier-info{display:flex;flex-direction:column;gap:4px}.stage-round-pill{font-size:0.8rem;font-weight:700;color:var(--gold-light);letter-spacing:0.05em;text-transform:uppercase}.stage-prize-title{font-size:1.8rem;font-weight:900;color:#fff;letter-spacing:0.02em}.stage-stats-strip{display:flex;gap:16px;font-size:0.9rem;color:var(--text-sub)}.stat-badge{background:var(--bg-surface);border:1px solid var(--border-subtle);padding:6px 14px;border-radius:var(--radius-sm);display:flex;align-items:center;gap:6px}.stat-badge strong{color:#fff}.stage-arena{display:grid;grid-template-columns:1fr 340px;gap:32px;align-items:center;margin:auto 0;max-width:1300px;width:100%;align-self:center}@media (max-width:1000px){.stage-arena{grid-template-columns:1fr}.stage-feed-box{display:none !important}}.stage-spotlight{display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}.wheel-assembly{position:relative;width:480px;height:480px;display:flex;align-items:center;justify-content:center}#wheel-canvas{width:480px;height:480px;border-radius:50%;box-shadow:0 16px 50px rgba(0,0,0,0.7),0 0 30px rgba(212,175,55,0.15)}.slot-machine-frame{width:100%;max-width:580px;height:220px;background:#0d0e12;border:2px solid var(--gold-dark);border-radius:20px;display:none;align-items:center;justify-content:center;overflow:hidden;box-shadow:inset 0 0 40px rgba(0,0,0,0.9),0 12px 40px rgba(0,0,0,0.6);position:relative}.slot-machine-frame::before,.slot-machine-frame::after{content:'';position:absolute;left:0;right:0;height:45px;pointer-events:none;z-index:3}.slot-machine-frame::before{top:0;background:linear-gradient(to bottom,#0d0e12,transparent)}.slot-machine-frame::after{bottom:0;background:linear-gradient(to top,#0d0e12,transparent)}.slot-machine-card{font-size:3.2rem;font-weight:900;color:#fff;text-shadow:0 4px 20px rgba(0,0,0,0.9);letter-spacing:0.04em;text-align:center;padding:0 24px}.slot-machine-card.rolling{color:#f3e5ab;filter:blur(0.8px)}.slot-machine-card.winner{color:var(--gold-primary);animation:winnerBounce 0.5s ease infinite alternate}@keyframes winnerBounce{from{transform:scale(1)}to{transform:scale(1.08)}}.stage-feed-box{background:var(--bg-panel);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:16px 20px;height:480px;display:flex;flex-direction:column;box-shadow:var(--shadow-elevation)}.feed-header{font-size:0.95rem;font-weight:700;color:#fff;display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--border-subtle)}.feed-scroll{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;margin-top:12px;padding-right:4px}.feed-item{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;animation:feedEnter 0.3s cubic-bezier(0.16,1,0.3,1)}@keyframes feedEnter{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}.feed-tier-name{font-size:0.78rem;font-weight:700;color:var(--gold-primary)}.feed-winner-name{font-size:1.15rem;font-weight:800;color:#fff;margin-top:2px}.stage-controls{display:flex;justify-content:space-between;align-items:center;background:var(--bg-panel);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:16px 28px}.stage-instructions{font-size:0.9rem;color:var(--text-sub)}.stage-instructions kbd{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:4px;padding:2px 8px;font-size:0.8rem;color:#fff;margin:0 4px}.btn-stage-spin{padding:16px 52px;font-size:1.4rem;font-weight:900;letter-spacing:0.05em;border-radius:50px;cursor:pointer;border:none;background:linear-gradient(135deg,#f3e5ab 0%,#d4af37 60%,#aa820a 100%);color:#111215;box-shadow:0 8px 30px rgba(212,175,55,0.45);transition:all 0.2s cubic-bezier(0.16,1,0.3,1)}.btn-stage-spin:hover:not(:disabled){transform:translateY(-2px) scale(1.02);box-shadow:0 12px 36px rgba(212,175,55,0.6)}.btn-stage-spin:disabled{opacity:0.4;cursor:not-allowed;transform:none}.btn-stage-spin.btn-conclude{background:linear-gradient(135deg,#fb923c 0%,#ea580c 100%);color:#fff;box-shadow:0 8px 30px rgba(234,88,12,0.45)}.modal-backdrop{position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(10,11,14,0.88);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;z-index:200}.modal-backdrop.active{display:flex}.ceremony-card{background:radial-gradient(circle at 50% 20%,#2a251a 0%,#16181f 80%);border:1.5px solid var(--gold-primary);border-radius:24px;padding:44px 56px;text-align:center;max-width:520px;width:90%;box-shadow:0 24px 60px rgba(0,0,0,0.9),0 0 50px rgba(212,175,55,0.35);animation:ceremonyPop 0.4s cubic-bezier(0.16,1,0.3,1)}@keyframes ceremonyPop{from{transform:scale(0.85);opacity:0}to{transform:scale(1);opacity:1}}.ceremony-tier{color:var(--gold-primary);font-size:1.15rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase}.ceremony-name{font-size:3.6rem;font-weight:900;color:#ffffff;margin:16px 0 28px;text-shadow:0 4px 30px rgba(212,175,55,0.5);word-break:break-all}.dialog-window{background:var(--bg-panel);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:26px 30px;max-width:440px;width:90%;box-shadow:0 24px 60px rgba(0,0,0,0.8);display:flex;flex-direction:column;gap:16px}.dialog-headline{font-size:1.2rem;font-weight:800;color:#fff}.dialog-body{font-size:0.95rem;color:var(--text-sub);line-height:1.6}.dialog-foot{display:flex;justify-content:flex-end;gap:12px;margin-top:4px}#confetti-canvas{position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:150}.hidden{display:none !important}</style>
</head>
<body>

  <!-- 頂部導覽列 -->
  <header>
    <div class="brand-group">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      </div>
      <div>
        <div class="brand-title">全離線抽獎大會系統</div>
      </div>
      <span class="brand-tag">純前端單檔 v1.2.0</span>
    </div>

    <div style="display:flex; gap:10px;">
      <button id="btn-fullscreen-toggle" class="btn-tool" title="全螢幕投屏模式">
        ⛶ 全螢幕投屏
      </button>
      <button id="btn-emergency-edit" class="btn-tool hidden" style="color:var(--gold-light);">
        ⮌ 返回設定
      </button>
    </div>
  </header>

  <main>
    <!-- 設定面板 (SETUP WORKSPACE) -->
    <div id="view-setup" class="view-panel active">
      <div class="workspace-grid">
        <!-- 候選人名單面板 -->
        <div class="panel-box">
          <div class="panel-header">
            <span class="panel-caption">
              候選人名冊
            </span>
            <span class="brand-tag" id="candidate-count-badge">0 人登記</span>
          </div>

          <div class="textarea-wrapper">
            <textarea id="input-candidates" placeholder="在此處每行輸入一位候選人姓名，例如：&#10;陳柏宇&#10;林冠廷&#10;黃詩婷&#10;張家豪&#10;李雅婷"></textarea>
            <div class="tools-toolbar">
              <button id="btn-load-sample" class="btn-tool">載入範例名單</button>
              <button id="btn-dedup-names" class="btn-tool">移除重複名單</button>
              <button id="btn-clear-names" class="btn-tool">清空名冊</button>
            </div>
          </div>

          <div class="file-dropzone" id="file-dropzone">
            將本機 .txt 或 .csv 名冊檔案拖曳至此直接匯入
            <input type="file" id="file-input" accept=".txt,.csv" style="display:none;">
          </div>
        </div>

        <!-- 獎項配置面板 -->
        <div class="panel-box">
          <div class="panel-header">
            <span class="panel-caption">
              獎項層級與順位
            </span>
            <button id="btn-add-prize" class="btn-tool" style="color:var(--gold-light);">+ 新增獎項</button>
          </div>

          <div class="order-config-bar">
            <span>大會抽獎流程順序：</span>
            <select id="config-draw-order" class="styled-select">
              <option value="BOTTOM_UP" selected>由小獎抽至大獎（暖場 ➔ 壓軸高潮）</option>
              <option value="TOP_DOWN">由大獎抽至小獎（由上至下）</option>
            </select>
          </div>

          <div class="prizes-container" id="prizes-list">
            <!-- 動態插入獎項項目 -->
          </div>

          <div class="rules-row">
            <label class="checkbox-item">
              <input type="checkbox" id="config-allow-duplicates"> 允許重複獲獎
            </label>
            <label class="checkbox-item">
              <input type="checkbox" id="config-auto-switch" checked> 抽滿自動推進次輪
            </label>
          </div>
        </div>
      </div>

      <!-- 底部主要操作工具列 -->
      <div class="actions-footer">
        <button id="btn-export-html" class="btn-cta btn-secondary-action" title="封裝為自包含獨立 HTML 單檔">
          <svg style="width:16px;height:16px;fill:currentColor;" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
          匯出隨身攜帶 HTML
        </button>
        <button id="btn-start-stage" class="btn-cta btn-gold-action">
          進入抽獎大會舞台
        </button>
      </div>
    </div>

    <!-- 抽獎舞台 (STAGE THEATER) -->
    <div id="view-stage" class="view-panel">
      <div class="stage-topbar">
        <div class="stage-tier-info">
          <span class="stage-round-pill" id="stage-order-tag">大會抽獎 ｜ 第 1 輪次</span>
          <span class="stage-prize-title" id="stage-prize-name">特獎</span>
        </div>

        <div class="stage-stats-strip">
          <div class="stat-badge">
            <span>本輪剩額</span>
            <strong id="stage-quota-remaining">0 / 0</strong>
          </div>
          <div class="stat-badge">
            <span>候選池剩餘</span>
            <strong id="stage-candidates-remaining">0 人</strong>
          </div>
          <button id="btn-export-csv" class="btn-tool" style="padding:6px 14px;">
            匯出中獎名單 (CSV)
          </button>
          <button id="btn-reset-all" class="btn-tool" style="padding:6px 14px; color:#f87171;">
            重置大會
          </button>
        </div>
      </div>

      <div class="stage-arena">
        <!-- 核心物理抽獎台 -->
        <div class="stage-spotlight">
          <!-- Canvas 彩色輪盤 (<= 30 人) -->
          <div class="wheel-assembly" id="wheel-wrapper">
            <canvas id="wheel-canvas" width="480" height="480"></canvas>
          </div>

          <!-- Slot Reel 機械滾輪卡片 (> 30 人) -->
          <div id="slot-machine-frame" class="slot-machine-frame">
            <div class="slot-machine-card current">準備抽獎</div>
          </div>
        </div>

        <!-- 現場即時榮譽榜 (Live Winner Honor Roll) -->
        <div class="stage-feed-box">
          <div class="feed-header">
            <span>現場中獎榮譽榜</span>
            <span class="brand-tag" id="history-counter">0 人</span>
          </div>
          <div class="feed-scroll" id="history-feed">
            <div style="color:var(--text-muted); text-align:center; margin-top:40px; font-size:0.85rem;">
              大會即將開獎，拭目以待
            </div>
          </div>
        </div>
      </div>

      <!-- 舞台底部核心互動列 -->
      <div class="stage-controls">
        <div class="stage-instructions" id="stage-status-hint">
          輕按 <kbd>Space 空白鍵</kbd> 或點擊右側按鈕開始搖獎
        </div>
        <button id="btn-spin" class="btn-stage-spin">
          開始抽獎
        </button>
      </div>
    </div>
  </main>

  <!-- 慶祝盛典彈窗 (Ceremony Modal) -->
  <div id="winner-modal-overlay" class="modal-backdrop">
    <div class="ceremony-card">
      <div class="ceremony-tier" id="modal-prize-tag">恭喜榮獲 特獎</div>
      <div class="ceremony-name" id="modal-winner-name">得獎人姓名</div>
      <button id="btn-modal-continue" class="btn-cta btn-gold-action" style="padding:12px 40px; font-size:1.15rem;">
        抽取下一位 (Space)
      </button>
    </div>
  </div>

  <!-- 內嵌自訂對話框 (Dialog Window，完全不受 iframe 限制) -->
  <div id="dialog-modal-overlay" class="modal-backdrop">
    <div class="dialog-window">
      <div class="dialog-headline" id="dialog-title">系統提示</div>
      <div class="dialog-body" id="dialog-msg">訊息說明內容</div>
      <div class="dialog-foot">
        <button id="dialog-btn-cancel" class="btn-tool" style="padding:8px 18px;">取消</button>
        <button id="dialog-btn-confirm" class="btn-cta btn-gold-action" style="padding:8px 22px; font-size:0.95rem;">確定</button>
      </div>
    </div>
  </div>

  <!-- 全螢幕紙花 Canvas -->
  <canvas id="confetti-canvas"></canvas>

  <!-- 自克隆資料容器 -->
  <script id="__INITIAL_BUNDLE__" type="text/plain">
  </script>

  <script>
  
  function getSecureRandomIndex(max) {
    if (typeof max !== 'number' || max <= 1) return 0;
    var cryptoObj = (typeof window !== 'undefined' && window.crypto) || (typeof globalThis !== 'undefined' && globalThis.crypto);
    if (!cryptoObj || !cryptoObj.getRandomValues) throw new Error('CSPRNG unavailable');
    var limit = Math.floor(0x100000000 / max) * max;
    var array = new Uint32Array(1);
    var randVal;
    do {
      cryptoObj.getRandomValues(array);
      randVal = array[0];
    } while (randVal >= limit);
    return randVal % max;
  }

  function parseCandidateText(rawText) {
    if (!rawText || typeof rawText !== 'string') return [];
    return rawText.split(/\r?\n/).map(function (s) { return s.trim(); }).filter(function (s) { return s.length > 0; });
  }

  function generateId() {
    var arr = new Uint8Array(8);

    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#ffffff';
    ctx.stroke();

    (history || []).forEach(function(rec, i){
      lines.push([
        sanitizeCsvCell(rec.sequence || (i + 1)),
        sanitizeCsvCell(rec.prizeName),
        sanitizeCsvCell(rec.winnerName),
        sanitizeCsvCell(rec.timestamp)
      ].join(','));
    });
    return lines.join('\r\n');
  }

  function downloadFile(content, name, mime) {
    var blob = new Blob([content], { type: mime });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name; a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
  }

  function escapeHtml(str) {
    return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  
  (function initApp() {
    var state = new StateManager({
      prizes: [
        { name: '特獎 (大獎)', totalQuota: 1 },
        { name: '頭獎', totalQuota: 2 },
        { name: '二獎 (普獎)', totalQuota: 5 }
      ]
    });

    var audio = new AudioSynthesizer();
    var confetti = new ConfettiEngine(document.getElementById('confetti-canvas'));
    var renderEngine = new RenderEngine(
      document.getElementById('wheel-canvas'),
      document.getElementById('slot-machine-frame'),
      audio
    );

    // DOM 元素快取
    var viewSetup = document.getElementById('view-setup');
    var viewStage = document.getElementById('view-stage');
    var inputCandidates = document.getElementById('input-candidates');
    var candidateBadge = document.getElementById('candidate-count-badge');
    var prizesList = document.getElementById('prizes-list');
    var btnAddPrize = document.getElementById('btn-add-prize');
    var selDrawOrder = document.getElementById('config-draw-order');
    var chkAllowDup = document.getElementById('config-allow-duplicates');
    var chkAutoSwitch = document.getElementById('config-auto-switch');
    var btnStartStage = document.getElementById('btn-start-stage');
    var btnExportHtml = document.getElementById('btn-export-html');
    var btnEmergencyEdit = document.getElementById('btn-emergency-edit');
    var btnSpin = document.getElementById('btn-spin');
    var stageOrderTag = document.getElementById('stage-order-tag');
    var stagePrizeName = document.getElementById('stage-prize-name');
    var stageQuotaRemaining = document.getElementById('stage-quota-remaining');
    var stageCandidatesRemaining = document.getElementById('stage-candidates-remaining');
    var stageStatusHint = document.getElementById('stage-status-hint');
    var historyCounter = document.getElementById('history-counter');
    var historyFeed = document.getElementById('history-feed');
    var btnExportCsv = document.getElementById('btn-export-csv');
    var btnResetAll = document.getElementById('btn-reset-all');
    var winnerModal = document.getElementById('winner-modal-overlay');
    var modalPrizeTag = document.getElementById('modal-prize-tag');
    var modalWinnerName = document.getElementById('modal-winner-name');
    var btnModalContinue = document.getElementById('btn-modal-continue');
    var fileDropzone = document.getElementById('file-dropzone');
    var fileInput = document.getElementById('file-input');
    var btnFullscreen = document.getElementById('btn-fullscreen-toggle');

    var btnLoadSample = document.getElementById('btn-load-sample');
    var btnDedupNames = document.getElementById('btn-dedup-names');
    var btnClearNames = document.getElementById('btn-clear-names');

    // 自訂對話框 (防 iframe 阻擋)
    var dialogOverlay = document.getElementById('dialog-modal-overlay');
    var dialogTitle = document.getElementById('dialog-title');
    var dialogMsg = document.getElementById('dialog-msg');
    var dialogBtnCancel = document.getElementById('dialog-btn-cancel');
    var dialogBtnConfirm = document.getElementById('dialog-btn-confirm');
    var onDialogConfirmAction = null;

    function openDialog(title, message, isConfirm, onConfirm) {
      dialogTitle.textContent = title;
      dialogMsg.textContent = message;
      dialogBtnCancel.style.display = isConfirm ? 'inline-block' : 'none';
      onDialogConfirmAction = onConfirm;
      dialogOverlay.classList.add('active');
    }
    dialogBtnCancel.onclick = function() { dialogOverlay.classList.remove('active'); };
    dialogBtnConfirm.onclick = function() {
      dialogOverlay.classList.remove('active');
      if (typeof onDialogConfirmAction === 'function') onDialogConfirmAction();
    };

    // 全螢幕切換
    btnFullscreen.onclick = function() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(function(){});
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    };

    // 名冊快速輔助工具
    btnLoadSample.onclick = function() {
      var sample = "陳冠宇\n林雅婷\n黃家豪\n張庭瑄\n李宗翰\n王欣怡\n吳柏毅\n劉佳穎\n蔡宗佑\n鄭宇軒\n許雅筑\n謝政廷\n宋詩涵\n楊凱傑\n潘品妤";
      inputCandidates.value = sample;
      state.setInputText(sample);
    };
    btnDedupNames.onclick = function() {
      var names = parseCandidateText(inputCandidates.value);
      var unique = Array.from(new Set(names));
      inputCandidates.value = unique.join('\n');
      state.setInputText(inputCandidates.value);
      openDialog('名單清理完成', '已濾除重複人名，現有名冊共 ' + unique.length + ' 人。', false);
    };
    btnClearNames.onclick = function() {
      openDialog('清空確認', '確定要清空目前輸入的名單文字？', true, function() {
        inputCandidates.value = '';
        state.setInputText('');
      });
    };

    // 檢查是否有 Base64 初始 Bundle
    var bundleScript = document.getElementById('__INITIAL_BUNDLE__');
    if (bundleScript && bundleScript.textContent.trim().length > 0) {
      state.importBundleBase64(bundleScript.textContent.trim());
      if (state.candidatePool.length > 0 && state.prizes.length > 0) {
        inputCandidates.value = state.rawInputText;
      }
    }

    // 渲染獎項卡片
    function renderPrizeInputs() {
      prizesList.innerHTML = '';
      var isBottomUp = state.config.drawOrder === 'BOTTOM_UP';
      var totalPrizes = state.prizes.length;

      state.prizes.forEach(function(p, idx) {
        var orderNum = isBottomUp ? (totalPrizes - idx) : (idx + 1);
        var isGrand = orderNum === totalPrizes;
        var rankClass = isGrand ? 'prize-rank-pill grand' : 'prize-rank-pill';
        var orderLabel = isGrand ? '★ 壓軸大獎' : ('第 ' + orderNum + ' 順位');

        var card = document.createElement('div');
        card.className = 'prize-card';
        card.innerHTML = 
          '<div class="' + rankClass + '">' + orderLabel + '</div>' +
          '<input type="text" value="' + escapeHtml(p.name) + '" placeholder="獎項名稱" data-id="' + p.id + '" class="p-name">' +
          '<input type="number" min="1" value="' + p.totalQuota + '" data-id="' + p.id + '" class="p-quota" title="配額數量">' +
          '<div class="reorder-btns">' +
            '<button class="btn-icon btn-move-up" data-idx="' + idx + '" title="順位前移" ' + (idx === 0 ? 'disabled style="opacity:0.2"' : '') + '>▲</button>' +
            '<button class="btn-icon btn-move-down" data-idx="' + idx + '" title="順位後移" ' + (idx === totalPrizes - 1 ? 'disabled style="opacity:0.2"' : '') + '>▼</button>' +
          '</div>' +
          '<button class="btn-icon del btn-del-p" data-id="' + p.id + '" title="刪除獎項">✕</button>';
        prizesList.appendChild(card);
      });
      syncPrizeListeners();
    }

    function syncPrizeListeners() {
      prizesList.querySelectorAll('.p-name').forEach(function(inp) {
        inp.oninput = function() {
          var id = this.getAttribute('data-id');
          var p = state.prizes.find(function(item){ return item.id === id; });
          if (p) { p.name = this.value; state.validate(); }
        };
      });
      prizesList.querySelectorAll('.p-quota').forEach(function(inp) {
        inp.oninput = function() {
          var id = this.getAttribute('data-id');
          var p = state.prizes.find(function(item){ return item.id === id; });
          if (p) {
            var val = Math.max(1, parseInt(this.value, 10) || 1);
            p.totalQuota = val;
            p.remainingQuota = val;
            state.validate();
          }
        };
      });
      prizesList.querySelectorAll('.btn-move-up').forEach(function(btn) {
        btn.onclick = function() {
          var idx = parseInt(this.getAttribute('data-idx'), 10);
          state.movePrize(idx, idx - 1);
          renderPrizeInputs();
        };
      });
      prizesList.querySelectorAll('.btn-move-down').forEach(function(btn) {
        btn.onclick = function() {
          var idx = parseInt(this.getAttribute('data-idx'), 10);
          state.movePrize(idx, idx + 1);
          renderPrizeInputs();
        };
      });
      prizesList.querySelectorAll('.btn-del-p').forEach(function(btn) {
        btn.onclick = function() {
          var id = this.getAttribute('data-id');
          state.removePrize(id);
          renderPrizeInputs();
        };
      });
    }

    btnAddPrize.onclick = function() {
      state.addPrize('獎項 ' + (state.prizes.length + 1), 1);
      renderPrizeInputs();
    };

    selDrawOrder.onchange = function() {
      state.updateConfig({ drawOrder: this.value });
      renderPrizeInputs();
    };

    inputCandidates.oninput = function() {
      state.setInputText(this.value);
    };

    fileDropzone.onclick = function() { fileInput.click(); };
    fileInput.onchange = function(e) {
      var file = e.target.files && e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(evt) {
        var content = evt.target.result || '';
        inputCandidates.value = content;
        state.setInputText(content);
      };
      reader.readAsText(file, 'utf-8');
    };

    chkAllowDup.onchange = function() { state.updateConfig({ allowDuplicates: this.checked }); };
    chkAutoSwitch.onchange = function() { state.updateConfig({ autoSwitchTier: this.checked }); };

    btnStartStage.onclick = function() {
      audio.init();
      if (!state.validate()) {
        openDialog('無法進入舞台', '請先輸入至少一位名單人員，並確保獎項配額大於 0。', false);
        return;
      }
      switchToStage();
    };

    function switchToStage() {
      viewSetup.classList.remove('active');
      viewStage.classList.add('active');
      btnEmergencyEdit.classList.remove('hidden');
      renderEngine.setCandidates(state.candidatePool);
      updateStageView();
    }

    btnEmergencyEdit.onclick = function() {
      openDialog('返回設定頁面', '確定返回設定頁面？目前未抽出的獎項進度將完整保留。', true, function() {
        renderEngine.stop();
        confetti.stop();
        winnerModal.classList.remove('active');
        state.emergencyEdit();
        viewStage.classList.remove('active');
        viewSetup.classList.add('active');
        btnEmergencyEdit.classList.add('hidden');
      });
    };

    function updateStageView() {
      var cur = state.getCurrentPrize();
      var s = state.getState();
      var ordered = state.getOrderedPrizes();
      candidateBadge.textContent = s.candidatePool.length + ' 人登記';
      historyCounter.textContent = s.history.length + ' 人獲獎';
      stageCandidatesRemaining.textContent = s.candidatePool.length + ' 人';

      var curIdx = -1;
      if (cur) {
        curIdx = ordered.findIndex(function(p){ return p.id === cur.id; });
      }

      if (cur) {
        var roundNum = curIdx >= 0 ? (curIdx + 1) : 1;
        var isGrand = roundNum === ordered.length;
        stageOrderTag.textContent = '大會抽獎 ｜ 第 ' + roundNum + ' 輪 (共 ' + ordered.length + ' 輪)' + (isGrand ? ' ★ 壓軸大獎' : '');
        stagePrizeName.textContent = cur.name;
        stageQuotaRemaining.textContent = cur.remainingQuota + ' / ' + cur.totalQuota;
      } else {
        stageOrderTag.textContent = '大會抽獎全部完成';
        stagePrizeName.textContent = '恭喜所有獲獎幸運兒';
        stageQuotaRemaining.textContent = '全部抽滿';
      }

      btnSpin.className = 'btn-stage-spin';

      if (s.status === 'READY') {
        btnSpin.disabled = false;
        btnSpin.textContent = '開始抽獎';
        stageStatusHint.innerHTML = '輕按 <kbd>Space 空白鍵</kbd> 或點擊按鈕抽取';
      } else if (s.status === 'SPINNING') {
        btnSpin.disabled = true;
        btnSpin.textContent = '搖獎中...';
        stageStatusHint.textContent = '命運輪盤旋轉中，敬請全場期待...';
      } else if (s.status === 'REVEALED') {
        btnSpin.disabled = false;
        btnSpin.textContent = '抽取下一位';
      } else if (s.status === 'PARTIAL_FILLED') {
        btnSpin.disabled = false;
        btnSpin.className = 'btn-stage-spin btn-conclude';
        btnSpin.textContent = '名額已空：提前結算大會';
        stageStatusHint.textContent = '候選名冊已全數抽空！點擊按鈕圓滿結算大會，或點「返回設定」補充名冊。';
      } else if (s.status === 'COMPLETED') {
        btnSpin.disabled = true;
        btnSpin.textContent = '大會圓滿落幕';
        stageStatusHint.textContent = '恭喜所有幸運兒！可點選上方「匯出 CSV」下載中獎名單';
      }

      renderLiveFeed();
    }

    function triggerSpinAction() {
      audio.init();
      var s = state.status;
      if (s === 'READY') {
        try {
          var pending = state.startSpin();
          updateStageView();
          renderEngine.spinTo(pending.winnerIndex, pending.winnerName, state.config.spinDurationMs, function() {
            var record = state.revealWinner();
            audio.playFanfare();
            confetti.fire();
            modalPrizeTag.textContent = '恭喜榮獲 ' + record.prizeName;
            modalWinnerName.textContent = record.winnerName;
            winnerModal.classList.add('active');
            updateStageView();
          });
        } catch(err) {
          console.warn(err);
        }
      } else if (s === 'REVEALED') {
        winnerModal.classList.remove('active');
        confetti.stop();
        state.continueSpin();
        renderEngine.setCandidates(state.candidatePool);
        updateStageView();
      } else if (s === 'PARTIAL_FILLED') {
        state.finishDraw();
        updateStageView();
      }
    }

    btnSpin.onclick = triggerSpinAction;
    btnModalContinue.onclick = function() {
      winnerModal.classList.remove('active');
      confetti.stop();
      if (state.status === 'REVEALED') {
        state.continueSpin();
        renderEngine.setCandidates(state.candidatePool);
        updateStageView();
      }
    };

    window.addEventListener('keydown', function(e) {
      if (e.code === 'Space') {
        if (document.activeElement && (document.activeElement.tagName === 'TEXTAREA' || document.activeElement.tagName === 'INPUT')) return;
        e.preventDefault();
        if (viewStage.classList.contains('active')) {
          triggerSpinAction();
        }
      } else if (e.code === 'Escape') {
        if (winnerModal.classList.contains('active')) {
          winnerModal.classList.remove('active');
          confetti.stop();
        }
      }
    });

    function renderLiveFeed() {
      historyFeed.innerHTML = '';
      if (state.history.length === 0) {
        historyFeed.innerHTML = '<div style="color:var(--text-muted); text-align:center; margin-top:40px; font-size:0.85rem;">大會即將開獎，拭目以待</div>';
        return;
      }
      state.history.slice().reverse().forEach(function(h) {
        var item = document.createElement('div');
        item.className = 'feed-item';
        item.innerHTML = 
          '<div>' +
            '<div class="feed-tier-name">#' + h.sequence + ' ' + escapeHtml(h.prizeName) + '</div>' +
            '<div class="feed-winner-name">' + escapeHtml(h.winnerName) + '</div>' +
          '</div>' +
          '<div style="font-size:0.75rem; color:var(--text-muted);">' + new Date(h.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'}) + '</div>';
        historyFeed.appendChild(item);
      });
    }

    btnExportCsv.onclick = function() {
      if (state.history.length === 0) {
        openDialog('無中獎資料', '目前尚未抽出中獎者，無法匯出 CSV。', false);
        return;
      }
      var csv = generateCsv(state.history);
      downloadFile(csv, '大會中獎名單_' + new Date().toISOString().slice(0, 10) + '.csv', 'text/csv;charset=utf-8;');
    };

    btnResetAll.onclick = function() {
      openDialog('重置確認', '確定要完整重置所有中獎紀錄並恢復初始抽獎名額？此操作不可復原。', true, function() {
        renderEngine.stop();
        confetti.stop();
        winnerModal.classList.remove('active');
        state.reset();
        renderEngine.setCandidates(state.candidatePool);
        updateStageView();
      });
    };

    btnExportHtml.onclick = function() {
      if (!state.validate()) {
        openDialog('無法匯出', '請先輸入候選人名單與獎項配額！', false);
        return;
      }
      var bundleB64 = state.exportBundleBase64();
      var fullHtml = document.documentElement.outerHTML;
      var bundleTag = '<script id="__INITIAL_BUNDLE__" type="text/plain">\n' + bundleB64 + '\n<\/script>';
      var regex = /<script\s+id="__INITIAL_BUNDLE__"\s+type="text\/plain">[\s\S]*?<\/script>/i;
      var outputHtml;
      if (regex.test(fullHtml)) {
        outputHtml = '<!DOCTYPE html>\n' + fullHtml.replace(regex, bundleTag);
      } else {
        outputHtml = '<!DOCTYPE html>\n' + fullHtml.replace('</body>', bundleTag + '\n</body>');
      }
      downloadFile(outputHtml, 'offline-lucky-draw-custom.html', 'text/html;charset=utf-8;');
    };

    renderPrizeInputs();
    state.subscribe(function(ev, s) {
      candidateBadge.textContent = s.candidatePool.length + ' 人登記';
      btnStartStage.disabled = !state.validate();
    });
    btnStartStage.disabled = !state.validate();
  })();
  </script>
